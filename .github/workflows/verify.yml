name: verify

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  # The decision tree is the only part of this product where being wrong has
  # consequences. It gets its own job so a bad verdict fails in seconds,
  # without waiting for a browser.
  decision-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit

  interface:
    runs-on: ubuntu-latest
    needs: decision-tree
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Serve the build and run the interface sweeps
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          node verify.mjs
